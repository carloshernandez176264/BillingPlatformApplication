spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    show-sql: false
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    enabled: false  # Deshabilitar Swagger en producción

logging:
  level:
    root: WARN
    com.billing.platform: INFO