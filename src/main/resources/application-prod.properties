# Base de datos
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Server
server.port=8081
server.error.include-stacktrace=never
server.error.include-message=never

# CORS
security.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}


# Health
management.health.mail.enabled=false
management.endpoints.web.exposure.include=health

# Deshabilitar Swagger en producción
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false