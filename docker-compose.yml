version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: billing_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-billing_prod}
      POSTGRES_USER: ${DB_USERNAME:-billing_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-billing_pass}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-billing_user} -d ${DB_NAME:-billing_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - billing_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: billing_backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-billing_prod}
      DB_USERNAME: ${DB_USERNAME:-billing_user}
      DB_PASSWORD: ${DB_PASSWORD:-billing_pass}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-900000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:80}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null",
             "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - billing_network

  frontend:
    build:
      context: ../billing-frontend
      dockerfile: Dockerfile
    container_name: billing_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - billing_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: billing_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@billing.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-pgadmin123}
    ports:
      - "5050:80"
    profiles:
      - dev-tools
    networks:
      - billing_network

volumes:
  postgres_data:
    driver: local

networks:
  billing_network:
    driver: bridge